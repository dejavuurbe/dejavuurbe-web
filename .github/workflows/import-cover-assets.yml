name: Importar portadas oficiales

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-cover-assets.yml'
      - 'assets/import/covers.b64.*'
      - 'scripts/import_cover_assets.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir portadas WebP
        run: python scripts/import_cover_assets.py
      - name: Guardar portadas y limpiar fragmentos
        run: |
          git config user.name "dejavuurbe"
          git config user.email "dejavuurbe@gmail.com"
          git add assets/covers assets/import
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Integrar portadas oficiales del catálogo"
            git push
          fi
