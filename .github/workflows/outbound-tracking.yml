name: Preparar medición de salidas

on:
  push:
    branches: [main]
    paths:
      - 'data/canciones.json'
      - 'data/analytics.json'
      - 'scripts/generar_salidas.py'
      - 'musica/**/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar rutas medibles
        run: python scripts/generar_salidas.py
      - name: Guardar cambios generados
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain salir)" ]; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "dejavuurbe"
          git config user.email "dejavuurbe@gmail.com"
          git add salir musica
          git commit -m "Actualizar medición de clics salientes"
          git push
