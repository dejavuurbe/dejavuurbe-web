name: Site check

on:
  schedule:
    - cron: '47 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar archivos esenciales
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/css/styles.css
          test -f sitemap.xml
          test -f robots.txt
          test -f data/canciones.json
          test -f data/site.json
          test -f data/identity.json
          test -f data/entity.jsonld
          test -f llms.txt
          test -f banda/index.html
          test -f musica/index.html
          test -f videos/index.html
          test -f prensa/index.html
          test -f enlaces/index.html
          test -f contacto/index.html
          test -f site.webmanifest
          test -f c6383b912d2d4c1697d3a14b7f5bd933.txt

      - name: Verificar identidad, catálogo y URL pública
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          site = json.loads(Path('data/site.json').read_text(encoding='utf-8'))
          ident = json.loads(Path('data/identity.json').read_text(encoding='utf-8'))
          songs = json.loads(Path('data/canciones.json').read_text(encoding='utf-8'))
          json.loads(Path('data/entity.jsonld').read_text(encoding='utf-8'))

          base = site['public_base'].rstrip('/')
          future = site.get('future_domain', '').rstrip('/')
          mode = site.get('mode', 'provisional')

          assert ident.get('name') == 'DejavuUrbe', 'Nombre de identidad incorrecto'
          assert ident.get('type') == 'MusicGroup', 'Tipo de entidad incorrecto'
          assert len(songs) == 10, f'Se esperaban 10 canciones y hay {len(songs)}'
          assert len({s['slug'] for s in songs}) == 10, 'Hay slugs duplicados'
          assert len({s['isrc'] for s in songs}) == 10, 'Hay ISRC duplicados'
          assert len({s['upc'] for s in songs}) == 10, 'Hay UPC duplicados'

          index = Path('index.html').read_text(encoding='utf-8')
          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          robots = Path('robots.txt').read_text(encoding='utf-8')

          assert 'MusicGroup' in index, 'Falta MusicGroup en la portada'
          assert base in index or (future and future in index), 'La portada no contiene una URL pública válida'
          assert base in sitemap or (future and future in sitemap), 'El sitemap no contiene una URL pública válida'
          assert base in robots or (future and future in robots), 'robots.txt no contiene una URL pública válida'

          for song in songs:
              slug = song['slug']
              page = Path('musica') / slug / 'index.html'
              assert page.exists(), f'Falta {page}'
              text = page.read_text(encoding='utf-8')
              for value in (song['titulo'], song['isrc'], song['upc'], 'MusicRecording'):
                  assert value in text, f'{page} no contiene {value}'
              assert f'/musica/{slug}/' in sitemap, f'El sitemap no contiene {slug}'

          print(f'OK: estructura e identidad válidas; modo={mode}; base={base}')
          PY

      - name: Auditoría detallada del catálogo
        run: python scripts/verificar_catalogo.py

      - name: Verificar integridad binaria de imágenes
        run: python scripts/verificar_imagenes.py

      - name: Verificar dominio publicado
        run: python scripts/verificar_sitio_publicado.py

