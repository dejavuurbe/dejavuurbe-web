name: Site check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '47 9 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar archivos esenciales
        run: |
          test -f index.html
          test -f assets/css/styles.css
          test -f sitemap.xml
          test -f robots.txt
          test -f data/canciones.json
          test -f data/site.json
          test -f data/identity.json
          test -f llms.txt
          test -f banda/index.html
          test -f musica/index.html
          test -f videos/index.html
          test -f prensa/index.html
          test -f enlaces/index.html
          test -f contacto/index.html
          test -f site.webmanifest
      - name: Verificar estructura y dominio configurado
        run: |
          grep -q 'MusicGroup' index.html
          grep -R -q 'MusicRecording' musica
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('data/site.json').read_text())
          base=cfg['public_base'].rstrip('/')
          for name in ['index.html','sitemap.xml','robots.txt']:
              text=Path(name).read_text()
              assert base in text, f'{base} no aparece en {name}'
          ident=json.loads(Path('data/identity.json').read_text())
          assert ident['name']=='DejavuUrbe'
          assert len(json.loads(Path('data/canciones.json').read_text()))==10
          PY
      - name: Verificar sincronización del catálogo
        run: python scripts/verificar_catalogo.py
