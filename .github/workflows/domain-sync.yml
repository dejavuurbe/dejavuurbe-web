name: Sincronizar dominio público

on:
  push:
    paths:
      - 'data/site.json'
      - 'scripts/configurar_dominio.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar dominio configurado
        run: python scripts/configurar_dominio.py
      - name: Confirmar cambios si corresponde
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Sin cambios de dominio pendientes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Sincronizar URLs públicas [skip ci]"
          git push
