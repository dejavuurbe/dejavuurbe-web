name: Actualizar páginas de canciones

on:
  push:
    branches: [main]
    paths:
      - 'data/canciones.json'
      - 'data/site.json'
      - 'scripts/generar_paginas_canciones.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar páginas
        run: python scripts/generar_paginas_canciones.py
      - name: Guardar cambios
        run: |
          git config user.name "dejavuurbe"
          git config user.email "dejavuurbe@gmail.com"
          git add musica/*/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar páginas de canciones desde catálogo"
            git push
          fi
