name: Crear páginas de canciones faltantes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear solo páginas faltantes
        run: python scripts/generar_paginas_canciones.py
      - name: Guardar cambios
        run: |
          git config user.name "dejavuurbe"
          git config user.email "dejavuurbe@gmail.com"
          git add musica/*/index.html
          if git diff --cached --quiet; then
            echo "Sin páginas nuevas"
          else
            git commit -m "Crear páginas faltantes desde catálogo"
            git push
          fi
