name: Restaurar imagenes historicas originales

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decodificar originales
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/history/album-art-2002-original-20260904.b64.txt
          test -f assets/history/rehearsal-2025-original-20260904.b64.txt
          base64 -d assets/history/album-art-2002-original-20260904.b64.txt > assets/history/album-art-2002.jpg
          base64 -d assets/history/rehearsal-2025-original-20260904.b64.txt > assets/history/rehearsal-2025.jpg
          file assets/history/album-art-2002.jpg
          file assets/history/rehearsal-2025.jpg
          rm assets/history/album-art-2002-original-20260904.b64.txt
          rm assets/history/rehearsal-2025-original-20260904.b64.txt
          rm .github/workflows/restore-history-images.yml
      - name: Publicar restauracion
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restaurar originales de portada 2002 y ensayo 2025'
          git push origin HEAD:main
