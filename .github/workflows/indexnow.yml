name: Notificar IndexNow

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'data/**'
      - 'assets/covers/**'
      - 'assets/history/**'
      - 'scripts/verificar_sitio_publicado.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-main
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Esperar y verificar la publicación
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if python scripts/verificar_sitio_publicado.py; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Publicación todavía no sincronizada; reintento $attempt/6"
              sleep 20
            fi
          done
          exit 1

      - name: Enviar las URLs del sitemap a IndexNow
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          key = 'c6383b912d2d4c1697d3a14b7f5bd933'
          namespace = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root = ET.parse('sitemap.xml').getroot()
          urls = [node.text.strip() for node in root.findall('sm:url/sm:loc', namespace) if node.text]
          assert urls, 'El sitemap no contiene URLs'

          payload = json.dumps({
              'host': 'dejavuurbe.com.ar',
              'key': key,
              'keyLocation': f'https://dejavuurbe.com.ar/{key}.txt',
              'urlList': urls,
          }).encode('utf-8')

          request = urllib.request.Request(
              'https://api.indexnow.org/indexnow',
              data=payload,
              headers={
                  'Content-Type': 'application/json; charset=utf-8',
                  'User-Agent': 'DejavuUrbe-IndexNow/1.0',
              },
              method='POST',
          )

          last_error = None
          for attempt in range(1, 4):
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status = response.status
                  if status in (200, 202):
                      print(f'OK: {len(urls)} URLs enviadas a IndexNow; HTTP {status}')
                      raise SystemExit(0)
                  last_error = f'HTTP {status}'
              except urllib.error.HTTPError as exc:
                  last_error = f'HTTP {exc.code}: {exc.read().decode("utf-8", errors="replace")[:500]}'
                  if exc.code not in (429, 500, 502, 503, 504):
                      break
              except urllib.error.URLError as exc:
                  last_error = str(exc)
              if attempt < 3:
                  time.sleep(10 * attempt)

          raise SystemExit(f'ERROR: IndexNow rechazó el envío: {last_error}')
          PY

