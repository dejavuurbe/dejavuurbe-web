name: Compactar historia de portada

on:
  push:
    paths:
      - 'scripts/compactar_historia_home.py'
      - '.github/workflows/compactar-historia-home.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compactar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compactar historia de portada
        run: python scripts/compactar_historia_home.py
      - name: Guardar cambios
        run: |
          if git diff --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Compacta historia en portada"
          git push
