name: Aplicar ajuste de escritorio

on:
  push:
    paths:
      - 'scripts/aplicar_ajuste_escritorio.py'
      - 'assets/css/desktop-tuning.css'
      - '.github/workflows/aplicar-ajuste-escritorio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Insertar hoja de ajuste en HTML
        run: python scripts/aplicar_ajuste_escritorio.py
      - name: Guardar cambios
        run: |
          if git diff --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html' 2>/dev/null || true
          git add -A
          git commit -m "Aplica ajuste visual de escritorio"
          git push
